name: Static site checks

on:
  push:
    branches: [main, 'build/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check ui-scripts.js
          node --check doc-processing.js
      - name: Check site structure and references
        run: node scripts/check-site.mjs
