name: Static site checks

on:
  push:
    branches: [main, 'build/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check ui-scripts.js
          node --check doc-processing.js
          node --check site-navigation.js
          node --check project-brief.js
          node --check showcase.js
          node --check scripts/check-layout.mjs
          node --check scripts/generate-services.mjs
      - name: Verify generated service pages
        run: node scripts/generate-services.mjs --check
      - name: Check site structure and references
        run: node scripts/check-site.mjs
